<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thumper · 资产详情</title>
  <link rel="stylesheet" href="/static/market.css" />
</head>
<body data-asset-id="{{ asset_id }}">
  <main class="market-shell">
    <nav class="market-nav">
      <div class="brand"><span class="brand-mark">T</span><span>Thumper</span></div>
      <div class="nav-actions"><a class="pill-link" href="/market?lang={{ lang }}">← 资产观察室</a><a class="pill-link" href="/">聊天</a></div>
    </nav>

    <header class="hero-row">
      <div><p class="eyebrow" id="asset-meta">正在读取资产</p><h1 id="asset-title">—</h1><p class="hero-copy" id="asset-source">所有概率均为实验性统计结果，不构成投资建议。</p></div>
      <button class="primary-button" id="refresh-asset" type="button">刷新行情与预测</button>
    </header>

    <div class="detail-layout">
      <div>
        <section class="detail-card">
          <div class="quote-number" id="detail-price">—</div>
          <div class="quote-meta" id="detail-quote-meta">等待行情</div>
          <div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 800 250" preserveAspectRatio="none" aria-label="历史价格走势"><path class="chart-area" id="chart-area"></path><polyline class="chart-line" id="chart-line"></polyline></svg></div>
        </section>

        <section class="detail-card" style="margin-top:18px">
          <h2>未来趋势概率</h2>
          <div class="prediction-grid" id="detail-predictions"></div>
          <p class="disclaimer" id="prediction-disclaimer">预测周期为未来 1、3、5、20 个交易日。实时推断只更新特征，不在页面请求中重新训练模型。</p>
        </section>

        <section class="detail-card" style="margin-top:18px">
          <h2>历史回测</h2>
          <div id="detail-backtest"></div>
          <p class="disclaimer" id="backtest-disclaimer">回测与上线后的真实预测记录应分开理解；命中率不等于收益率。</p>
        </section>
      </div>

      <aside>
        <section class="detail-card"><h2>风险概览</h2><div class="metric-list" id="detail-risk"></div></section>
        <section class="detail-card" id="simulation-card" style="margin-top:18px"><h2>模拟策略</h2><div class="metric-list" id="detail-simulation"></div><p class="disclaimer">模拟采用概率阈值与买入持有对比，包含交易成本假设。历史模拟不代表未来收益。</p></section>
        <section class="detail-card" style="margin-top:18px"><h2>数据说明</h2><div class="metric-list" id="detail-data"></div></section>
      </aside>
    </div>
  </main>
  <script src="/static/asset_detail.js"></script>
</body>
</html>
